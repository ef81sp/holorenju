# lefthook.yaml
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    check-fix:
      run: pnpm check-fix
      stage_fixed: true

    test:
      run: pnpm test

    zig-test:
      run: cd zig && zig build test

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test

    zig-test-golden:
      run: cd zig && zig build test-golden
